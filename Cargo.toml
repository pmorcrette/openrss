[package]
name = "openrss"
version = "1.0.0"
description = "A beautiful, self-hosted RSS reader with custom themes and an MCP server for AI agents"
license = "GPL-3.0-or-later"
repository = "https://github.com/pmorcrette/openrss"
edition = "2024"

[dependencies]
ammonia = "4.2.4"
anyhow = "1.0.104"
axum = { version = "0.8.9", features = ["macros"] }
base64 = "0.23.1"
chrono = { version = "0.4.45", features = ["serde"] }
ego-tree = "0.11"
feed-rs = "3.0.0"
futures = "0.3.34"
mime_guess = "2.0.5"
quick-xml = "0.42.0"
regex = "1.13.1"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "gzip", "brotli", "deflate", "json", "http2", "charset"] }
rmcp = { version = "3.6.0", features = ["server", "transport-streamable-http-server", "transport-io", "macros"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
rust-embed = "8.13.0"
schemars = "1.2.3"
scraper = "0.27.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.0", features = ["full"] }
tower-http = { version = "0.7.1", features = ["trace", "compression-gzip", "set-header"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
url = "2.5.8"
