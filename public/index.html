<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#efefeb">
  <title>OpenRSS</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="stylesheet" href="/css/app.css">
  <script>
    // Apply the last used theme before first paint.
    try {
      const t = JSON.parse(localStorage.getItem('openrss.theme'));
      if (t) {
        const r = document.documentElement;
        for (const [k, v] of Object.entries(t.vars || {})) r.style.setProperty(k, v);
        r.dataset.base = t.base;
        r.style.colorScheme = t.base;
      }
    } catch {}
  </script>
  <script type="module" src="/js/app.js"></script>
</head>
<body>
  <div class="app" id="app" data-pane="list">
    <aside class="sidebar" id="sidebar" aria-label="Feeds">
      <header class="sidebar-head">
        <a class="brand" href="/" aria-label="OpenRSS home">
          <img src="/favicon.svg" alt="" width="26" height="26">
          <span>OpenRSS</span>
        </a>
        <button class="icon-btn" id="add-feed-btn" title="Add feed (a)" aria-label="Add feed" data-icon="plus"></button>
      </header>
      <nav class="sidebar-nav" id="nav"></nav>
      <footer class="sidebar-foot">
        <button class="ghost-btn" id="refresh-btn" title="Refresh all feeds (r)"><span data-icon="refresh"></span><span>Refresh</span></button>
        <button class="ghost-btn" id="settings-btn" title="Settings"><span data-icon="settings"></span><span>Settings</span></button>
      </footer>
    </aside>

    <section class="list-pane" id="list-pane" aria-label="Articles">
      <header class="pane-head">
        <button class="icon-btn only-mobile" id="menu-btn" aria-label="Show feeds" data-icon="menu"></button>
        <div class="pane-title">
          <h1 id="view-title">All articles</h1>
          <p id="view-subtitle" class="muted"></p>
        </div>
        <div class="pane-actions">
          <button class="icon-btn" id="mark-all-btn" title="Mark all as read (Shift+A)" aria-label="Mark all as read" data-icon="check-all"></button>
        </div>
      </header>
      <div class="list-tools">
        <label class="search">
          <span data-icon="search"></span>
          <input id="search" type="search" placeholder="Search articles" autocomplete="off" aria-label="Search articles">
          <kbd>/</kbd>
        </label>
        <div class="segmented" role="tablist" aria-label="Filter">
          <button role="tab" data-filter="unread">Unread</button>
          <button role="tab" data-filter="all">All</button>
        </div>
      </div>
      <div class="article-list" id="article-list" role="list" tabindex="-1"></div>
    </section>

    <main class="reader-pane" id="reader-pane" aria-label="Reader">
      <div class="reader-empty" id="reader-empty">
        <div class="empty-mark" data-icon="book"></div>
        <p>Select an article to start reading</p>
        <p class="muted small">Press <kbd>j</kbd> / <kbd>k</kbd> to move, <kbd>?</kbd> for all shortcuts</p>
      </div>
      <article class="reader" id="reader" hidden></article>
    </main>
  </div>

  <div class="scrim" id="scrim" hidden></div>
  <div class="toasts" id="toasts" role="status" aria-live="polite"></div>
  <dialog class="modal" id="modal"></dialog>
</body>
</html>
