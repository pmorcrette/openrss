name: Release

# Publishes prebuilt binaries as a GitHub Release when a version tag (v1.2.3)
# is pushed on a commit that is part of master. Run it manually to test the
# builds without publishing anything.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify tag
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Tag must be on master
        run: |
          git fetch origin master
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/master; then
            echo "::error::$GITHUB_REF_NAME points to a commit that is not on master"
            exit 1
          fi
      - name: Tag must match the Cargo.toml version
        run: |
          version=$(grep -m1 '^version' Cargo.toml | cut -d '"' -f2)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match Cargo.toml version $version"
            exit 1
          fi

  build:
    name: Build ${{ matrix.target }}
    needs: verify
    # Also run for manual dispatches, where `verify` is skipped.
    if: ${{ !failure() && !cancelled() }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux builds are static (musl), made in the same Alpine image as the Docker build.
          - { target: x86_64-unknown-linux-musl, os: ubuntu-latest, docker: true }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-24.04-arm, docker: true }
          - { target: aarch64-apple-darwin, os: macos-latest }
          - { target: x86_64-apple-darwin, os: macos-latest, cross: true }
          - { target: x86_64-pc-windows-msvc, os: windows-latest, exe: .exe }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Build (Alpine container)
        if: matrix.docker
        run: |
          docker run --rm -v "$PWD":/src -w /src rust:1-alpine \
            cargo build --release --locked --target ${{ matrix.target }}

      - uses: dtolnay/rust-toolchain@stable
        if: ${{ !matrix.docker }}
        with:
          targets: ${{ matrix.target }}
      - name: Build
        if: ${{ !matrix.docker }}
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Smoke test
        if: ${{ !matrix.cross }}
        run: target/${{ matrix.target }}/release/openrss${{ matrix.exe }} --version

      - name: Package
        run: |
          name="openrss-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir -p "dist/$name"
          cp "target/${{ matrix.target }}/release/openrss${{ matrix.exe }}" README.md LICENSE "dist/$name/"
          cd dist
          if [ -n "${{ matrix.exe }}" ]; then
            7z a -tzip "$name.zip" "$name" > /dev/null
          else
            tar -czf "$name.tar.gz" "$name"
          fi
          rm -rf "$name"
          ls -l
      - uses: actions/upload-artifact@v4
        with:
          name: openrss-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: sha256sum * | tee SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true
